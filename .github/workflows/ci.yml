name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run glados

      - name: Build and test preview image
        run: |
          docker build --build-arg APP_ENV=preview --tag ozmah-dev-astro:preview .
          ./scripts/smoke-container.sh ozmah-dev-astro:preview preview 3100

      - name: Build and test production image
        run: |
          docker build \
            --build-arg APP_ENV=production \
            --build-arg PUBLIC_POSTHOG_KEY=ci_public_placeholder \
            --tag ozmah-dev-astro:production .
          ./scripts/smoke-container.sh ozmah-dev-astro:production production 3101
